name: Deploy Frontend to S3 & CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Static Next.js App
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || '/api' }}
        run: npm run build

      - name: 🔑 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: 🚀 Sync Static Build to S3 Bucket
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_FRONTEND_BUCKET || 'finflow-frontend-ananya-2026' }}
        run: |
          # 1. Upload hashed static assets (_next/static) with immutable 1-year cache
          aws s3 sync out/_next/static/ s3://$S3_BUCKET/_next/static/ --delete \
            --cache-control "public, max-age=31536000, immutable"

          # 2. Upload all other assets (HTML, txt, JSON, root) with 0 cache & must-revalidate
          aws s3 sync out/ s3://$S3_BUCKET/ --delete \
            --exclude "_next/static/*" \
            --cache-control "public, max-age=0, must-revalidate"

          # 3. Explicitly set content-type: text/x-component for all Next.js RSC payload files
          aws s3 cp out/ s3://$S3_BUCKET/ --recursive \
            --exclude "*" --include "*.txt" \
            --content-type "text/x-component" \
            --cache-control "public, max-age=0, must-revalidate" \
            --metadata-directive REPLACE

          # 4. Upload clean URL objects (e.g. /budgets, /dashboard, /login) so S3 direct requests never 403
          for dir in out/*/; do
            route=$(basename "$dir")
            if [ -f "out/$route/index.html" ]; then
              aws s3 cp "out/$route/index.html" "s3://$S3_BUCKET/$route" \
                --content-type "text/html" \
                --cache-control "public, max-age=0, must-revalidate"
            fi
          done

      - name: 🔄 Invalidate CloudFront CDN Cache
        env:
          DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'E13TP2T4TVA51A' }}
        run: |
          echo "Invalidating CloudFront Cache for Distribution: $DISTRIBUTION_ID..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Created CloudFront Invalidation ID: $INVALIDATION_ID"
