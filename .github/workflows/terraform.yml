name: Terraform

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:

# Prevent concurrent terraform runs
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Terraform Validation & Plan
  # ─────────────────────────────────────────────
  terraform-check:
    name: Terraform Check
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Comment PR (Format Check)
        if: github.event_name == 'pull_request' && steps.fmt.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Format Check Failed
              
              Please run \`terraform fmt -recursive\` to fix formatting issues.
              
              \`\`\`
              cd terraform
              terraform fmt -recursive
              \`\`\`
              `
            })

      - name: Comment PR (Success)
        if: github.event_name == 'pull_request' && steps.validate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fmt_result = '${{ steps.fmt.outcome }}' === 'success' ? '✅' : '⚠️';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Check Results
              
              | Check | Status |
              |-------|--------|
              | Format | ${fmt_result} |
              | Validate | ✅ |
              
              Terraform configuration is valid!
              
              **Note**: This workflow does not have AWS credentials configured.
              To run \`terraform plan\`, configure AWS credentials locally or set up GitHub OIDC.
              `
            })

